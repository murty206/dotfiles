# =============================================================================
# kitty.conf — Murty's Kitty terminal config
# Managed via dotfiles. Edit here, push to GitHub, run 'update' to sync.
# =============================================================================

# Font
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        10.0

# 1984 Dark Theme color scheme
foreground              #a9b1d6
background              #180b17
selection_foreground    #1a1b26
selection_background    #7aa2f7
cursor                  #c0caf5
cursor_text_color       #1a1b26

# Black
color0  #000000
color8  #000000

# Red
color1  #ff16b0
color9  #ff16b0

# Green
color2  #b3f361
color10 #b3f361

# Yellow
color3  #ffea16
color11 #ffea16

# Blue
color4  #15d4c8
color12 #40e0d0

# Magenta
color5  #f806fa
color13 #f806fa

# Cyan
color6  #59e1e3
color14 #6be4e6

# White
color7  #feffff
color15 #feffff

# URL styles
url_color #f806fa
url_style single

# Window
window_padding_width    8
background_opacity      0.85
confirm_os_window_close 0
# Fixed starting size in cells, so it survives font and scale changes.
# remember_window_size would reopen at whatever the last window happened to be.
remember_window_size    no
initial_window_width    126c
initial_window_height   34c

# Scrollback
scrollback_lines        10000
# Shift+PageUp/PageDown scroll a page, as in Konsole. Kitty's own default
# (ctrl+shift+page_up/down) still works; plain PageDown reaching zsh only types a ~.
map shift+page_up       scroll_page_up
map shift+page_down     scroll_page_down
# Ctrl+End jumps to the bottom of the scrollback. Editors use Ctrl+End for
# end-of-file, so it is handed back to them: the window title is the running
# command (shell integration), and an empty --when-focus-on map unmaps the key.
map ctrl+end            scroll_end
map --when-focus-on title:^(sudo.)?(nano|n?vim?|micro)([^a-z]|$) ctrl+end

# Performance
repaint_delay           10
input_delay             3
sync_to_monitor         yes

# Bell
enable_audio_bell       no
# Copy on select, paste on right click (like PowerShell)
copy_on_select                  yes
mouse_map right press ungrabbed paste_from_clipboard


# BEGIN_KITTY_THEME
# 1984 Dark
#include current-theme.conf
# END_KITTY_THEME
